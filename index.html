<style>
:root{
  --bg:#04100F; --bg2:#071918; --ink:#EAF6F3; --mut:#8FA9A5; --mut2:#5F7A76;
  --em:#10C98F; --em2:#0A9C6E; --sea:#12A9CC; --pink:#FF5FA2; --red:#E5334B; --gold:#F3C969;
  --card:linear-gradient(160deg,rgba(22,44,44,.86),rgba(7,22,22,.92));
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --grad:linear-gradient(135deg,#10C98F 0%,#12A9CC 100%);
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
button{font-family:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font-family:inherit;color:var(--ink);font-size:16px}
.hidden{display:none!important}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding-top:var(--safe-t)}
.scr{flex:1;overflow-y:auto;padding:16px 16px calc(90px + var(--safe-b));-webkit-overflow-scrolling:touch}
.top{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 0}
.logo{font-weight:800;font-size:20px;letter-spacing:-.02em}
.logo b{color:var(--em)}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;margin-bottom:12px}
h2{margin:0 0 10px;font-size:20px}
h3{margin:0 0 6px;font-size:16px}
.mut{color:var(--mut);font-size:13px}
.btn{display:block;width:100%;padding:15px;border-radius:16px;background:var(--grad);color:#032018;font-weight:800;font-size:16px;text-align:center}
.btn.sec{background:rgba(255,255,255,.07);color:var(--ink);border:1px solid var(--line2)}
.btn.red{background:linear-gradient(135deg,#E5334B,#9c1f33);color:#fff}
.btn:disabled{opacity:.5}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,select{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--line2);background:rgba(255,255,255,.05);outline:none}
input:focus,select:focus{border-color:var(--em)}
select option{color:#000}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(4,16,15,.96);border-top:1px solid var(--line);padding-bottom:var(--safe-b);z-index:5}
.tabs button{flex:1;padding:12px 4px;font-size:12px;color:var(--mut)}
.tabs button.on{color:var(--em)}
.tabs button span{display:block;font-size:20px}
.sw{display:flex;align-items:center;justify-content:space-between;padding:16px;border-radius:20px;border:1px solid var(--line2);background:var(--card);margin-bottom:12px}
.sw.on{border-color:var(--em);box-shadow:0 0 0 1px var(--em) inset}
.tog{width:58px;height:32px;border-radius:20px;background:#2a3d3b;position:relative;transition:.2s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:.2s}
.sw.on .tog{background:var(--em)}
.sw.on .tog::after{left:29px}
.ride{border:1px solid var(--line2);border-radius:18px;padding:14px;margin-bottom:12px;background:rgba(255,255,255,.04)}
.ride .p{font-size:22px;font-weight:800;color:var(--em)}
.ride .a{font-size:14px;margin:4px 0}
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:12px;background:rgba(16,201,143,.15);color:var(--em)}
.badge.w{background:rgba(243,201,105,.15);color:var(--gold)}
.badge.r{background:rgba(229,51,75,.15);color:#ff7b8c}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat div{background:rgba(255,255,255,.05);border-radius:16px;padding:14px}
.stat b{display:block;font-size:22px;margin-top:4px}
#toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translate(-50%,20px);background:#10211f;border:1px solid var(--line2);padding:11px 16px;border-radius:14px;opacity:0;pointer-events:none;transition:.25s;z-index:20;max-width:90%;text-align:center;font-size:14px}
#toast.on{opacity:1;transform:translate(-50%,0)}
.err{color:#ff7b8c;font-size:13px;min-height:18px;margin-top:8px}
.lnk{color:var(--em);text-decoration:underline;font-size:14px}
.big{font-size:42px;text-align:center;margin:12px 0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;z-index:30}
.modal>div{width:100%;background:#0a1c1a;border-radius:24px 24px 0 0;padding:20px 16px calc(20px + var(--safe-b));max-height:85%;overflow:auto}
#ovr{position:fixed;inset:0;z-index:40;background:rgba(2,10,9,.94);display:flex;flex-direction:column;padding:calc(14px + var(--safe-t)) 16px calc(16px + var(--safe-b))}
#ovr .hd{display:flex;align-items:center;justify-content:space-between}
.ring{position:relative;width:64px;height:64px}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:22px}
#ovr .pr{text-align:center;margin:10px 0 2px;font-size:56px;font-weight:800;color:var(--em);letter-spacing:-.02em}
#ovr .sub{text-align:center;color:var(--mut);font-size:14px}
.ovc{background:var(--card);border:1px solid var(--line2);border-radius:20px;padding:14px;margin-top:14px}
.ovc .l{display:flex;gap:12px;align-items:flex-start;padding:6px 0}
.ovc .l+.l{border-top:1px dashed var(--line2)}
.dot{width:12px;height:12px;border-radius:50%;margin-top:5px;flex:none}
.dot.a{background:var(--em)}.dot.b{background:var(--pink);border-radius:3px}
.ovc small{color:var(--mut);display:block;font-size:12px}
.ovc b{font-size:16px}
#ovr .acts{margin-top:auto;display:flex;gap:10px;align-items:stretch}
#ovr .acts .x{flex:0 0 64px;border-radius:18px;border:1px solid var(--line2);font-size:26px;background:rgba(255,255,255,.06)}
#ovr .acts .ok{flex:1;padding:20px;border-radius:18px;background:var(--grad);color:#032018;font-weight:800;font-size:20px}
#v-nav{position:fixed;inset:0;z-index:12;background:#0a1c1a}
#gmap{position:absolute;inset:0}
#navTop{position:absolute;left:10px;right:10px;top:calc(10px + var(--safe-t));z-index:3;background:rgba(7,25,24,.96);border:1px solid var(--line2);border-radius:20px;padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#navTop .m{display:flex;gap:12px;align-items:center}
#navTop .ic{font-size:34px;width:44px;text-align:center}
#navTop .t{font-size:17px;font-weight:700;line-height:1.25}
#navTop .d{color:var(--em);font-weight:800;font-size:20px}
#navTop .s{color:var(--mut);font-size:12px;margin-top:6px}
#navSheet{position:absolute;left:0;right:0;bottom:0;z-index:3;background:rgba(7,25,24,.98);border-radius:24px 24px 0 0;border-top:1px solid var(--line2);padding:14px 16px calc(14px + var(--safe-b));box-shadow:0 -10px 30px rgba(0,0,0,.5)}
#navCenter{position:absolute;right:12px;bottom:calc(var(--sheet-h,260px) + 12px);z-index:3;width:48px;height:48px;border-radius:50%;background:#0a1c1a;border:1px solid var(--line2);font-size:22px}
.mapfail{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--mut)}
.chip{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;background:rgba(16,201,143,.15);color:var(--em)}
</style>
</head>
<body>
<div id="app">
  <div class="top"><div class="logo">Go Route <b>Sürücü</b></div><div id="topSt" class="mut"></div></div>
  <div id="v-load" class="scr"><div class="big">🚕</div><p class="mut" style="text-align:center">Yüklənir…</p></div>
  <div id="v-auth" class="scr hidden"></div>
  <div id="v-prof" class="scr hidden"></div>
  <div id="v-wait" class="scr hidden"></div>
  <div id="v-home" class="scr hidden"></div>
  <div id="v-earn" class="scr hidden"></div>
  <div id="v-me" class="scr hidden"></div>
  <nav class="tabs hidden" id="tabs">
    <button data-t="home" class="on"><span>🚕</span>Sifarişlər</button>
    <button data-t="earn"><span>💰</span>Qazanc</button>
    <button data-t="me"><span>👤</span>Profil</button>
  </nav>
</div>
<div id="ovr" class="hidden"></div>
<div id="v-nav" class="hidden"></div>
<div id="toast"></div>

<script type="module">
import { initializeApp } from "firebase/app";
import { getAuth, onAuthStateChanged, GoogleAuthProvider, signInWithPopup, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail, signOut, deleteUser } from "firebase/auth";
import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, onSnapshot, query, where, limit, runTransaction, deleteDoc } from "firebase/firestore";

const firebaseConfig = {
  apiKey: "AIzaSyBQIDfObXpxNa1hVAYDmigSi9u49y_BJQc",
  authDomain: "bkaugo.firebaseapp.com",
  projectId: "bkaugo",
  storageBucket: "bkaugo.firebasestorage.app",
  messagingSenderId: "568740538737",
  appId: "1:568740538737:web:9b2ab40d0b728789a1aed0",
  measurementId: "G-44T95W0PSX"
};
const fbApp = initializeApp(firebaseConfig, "bakugo-surucu");
const auth = getAuth(fbApp);
const db = getFirestore(fbApp);

const NATIVE = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
const CLASSES = [["eko", "Ekonom"], ["komfort", "Komfort"], ["biznes", "Biznes"], ["xl", "Minivan"], ["yuk", "Yük daşıma"], ["pet", "Ev heyvanı"]];
const RADIUS_KM = 8, MAX_AGE_MS = 5 * 60 * 1000, OV_SEC = 20;
const GMAPS_KEY = "AIzaSyAQcVU7_ac2e73cMF__xd_t40Xu2kJchF4";
const STYLE_DARK = [ 
  { elementType: "geometry", stylers: [{ color: "#10272a" }] },
  { elementType: "labels.text.fill", stylers: [{ color: "#a3c4c0" }] },
  { elementType: "labels.text.stroke", stylers: [{ color: "#0b1d1f" }, { weight: 3 }] },
  { elementType: "labels.icon", stylers: [{ visibility: "off" }] },
  { featureType: "administrative", elementType: "geometry.stroke", stylers: [{ color: "#2c5458" }] },
  { featureType: "administrative.land_parcel", stylers: [{ visibility: "off" }] },
  { featureType: "administrative.locality", elementType: "labels.text.fill", stylers: [{ color: "#d6f2ec" }] },
  { featureType: "administrative.neighborhood", elementType: "labels.text.fill", stylers: [{ color: "#7fa9a4" }] },
  { featureType: "landscape.man_made", elementType: "geometry", stylers: [{ color: "#132f33" }] },
  { featureType: "landscape.natural", elementType: "geometry", stylers: [{ color: "#0f2a27" }] },
  { featureType: "poi", elementType: "geometry", stylers: [{ color: "#143236" }] },
  { featureType: "poi", elementType: "labels", stylers: [{ visibility: "off" }] },
  { featureType: "poi.park", elementType: "geometry", stylers: [{ color: "#11463a" }] },
  { featureType: "road", elementType: "geometry.fill", stylers: [{ color: "#2a4c52" }] },
  { featureType: "road", elementType: "geometry.stroke", stylers: [{ color: "#0d2124" }] },
  { featureType: "road", elementType: "labels.text.fill", stylers: [{ color: "#b4d3cf" }] },
  { featureType: "road.local", elementType: "geometry.fill", stylers: [{ color: "#22403f" }] },
  { featureType: "road.arterial", elementType: "geometry.fill", stylers: [{ color: "#33616a" }] },
  { featureType: "road.highway", elementType: "geometry.fill", stylers: [{ color: "#1d7f7c" }] },
  { featureType: "road.highway", elementType: "geometry.stroke", stylers: [{ color: "#0b3c3f" }] },
  { featureType: "road.highway", elementType: "labels.text.fill", stylers: [{ color: "#e3fff8" }] },
  { featureType: "transit.line", elementType: "geometry", stylers: [{ color: "#3a2a44" }] },
  { featureType: "transit.station", stylers: [{ visibility: "off" }] },
  { featureType: "water", elementType: "geometry", stylers: [{ color: "#0a4a6b" }] },
  { featureType: "water", elementType: "labels.text.fill", stylers: [{ color: "#6cc3e6" }] }
];



const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
const money = (n) => (Math.round((+n || 0) * 100) / 100).toFixed(2);
function toast(t, ms) { const x = $("toast"); x.textContent = t; x.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => x.classList.remove("on"), ms || 2800); }
function hav(a, b) { const R = 6371, r = (d) => d * Math.PI / 180; const dLa = r(b.lat - a.lat), dLo = r(b.lng - a.lng); const x = Math.sin(dLa / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLo / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(x)); }
function bearing(a, b) { const r = (d) => d * Math.PI / 180, y = Math.sin(r(b.lng - a.lng)) * Math.cos(r(b.lat)), x = Math.cos(r(a.lat)) * Math.sin(r(b.lat)) - Math.sin(r(a.lat)) * Math.cos(r(b.lat)) * Math.cos(r(b.lng - a.lng)); return (Math.atan2(y, x) * 180 / Math.PI + 360) % 360; }
const fmtKm = (m) => m < 950 ? Math.max(10, Math.round(m / 10) * 10) + " m" : (m / 1000).toFixed(1) + " km";
const fmtMin = (sec) => { const m = Math.max(1, Math.round(sec / 60)); return m < 60 ? m + " dəq" : Math.floor(m / 60) + " s " + (m % 60) + " dəq"; };
const commOf = (price) => Math.round((+price || 0) * (S.settings.commissionPct || 0) / 100 * 100) / 100;
const AE = {
  "auth/invalid-credential": "E-poçt və ya parol yanlışdır", "auth/wrong-password": "Parol yanlışdır", "auth/user-not-found": "Bu e-poçtla hesab yoxdur",
  "auth/email-already-in-use": "Bu e-poçt artıq qeydiyyatdadır", "auth/weak-password": "Parol ən azı 6 simvol olmalıdır", "auth/invalid-email": "E-poçt düzgün deyil",
  "auth/network-request-failed": "İnternet bağlantısı yoxdur", "auth/too-many-requests": "Çox cəhd edildi, bir az sonra yenidən yoxlayın"
};
function fbErr(e) { const c = e && e.code || ""; if (AE[c]) return AE[c]; if (c === "permission-denied") return "İcazə yoxdur (hesabınız təsdiqlənməyib və ya sifariş artıq götürülüb)"; if (c === "unavailable") return "İnternet bağlantısı yoxdur"; return (e && e.message) || "Xəta baş verdi"; }

/* ---------------- Vəziyyət ---------------- */
const S = {
  me: null, prof: null, tab: "home", online: localStorage.getItem("bgsOnline") === "1",
  pos: null, rides: [], hidden: new Set(), active: null, history: [], settings: { waitFree: 3, waitPerMin: 0.2, commissionPct: 0 }, nav: null, navBuilt: false, gm: null,
  lastSent: null, lastSentAt: 0, demo: false
};
let unsubProf = null, unsubRides = null, unsubActive = null, watchId = null, wakeLock = null, beepCtx = null, seenRides = new Set();

function show(id) {
  for (const v of ["load", "auth", "prof", "wait", "home", "earn", "me"]) $("v-" + v).classList.toggle("hidden", v !== id);
  const main = ["home", "earn", "me"].includes(id);
  $("tabs").classList.toggle("hidden", !main);
  if (main) document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("on", b.dataset.t === id));
  $("topSt").textContent = S.online && main ? "🟢 Xəttdə" : "";
}
document.querySelectorAll("#tabs button").forEach((b) => b.onclick = () => { S.tab = b.dataset.t; route(); });

/* ---------------- Giriş ---------------- */
let upMode = false;
function authView() {
  show("auth");
  $("v-auth").innerHTML = `<div class="big">🚕</div><h2 style="text-align:center">${upMode ? "Sürücü qeydiyyatı" : "Sürücü girişi"}</h2>
  <p class="mut" style="text-align:center">Go Route Taksi sürücüləri üçün</p>
  <div class="card">
    <label>E-poçt</label><input id="aE" type="email" autocomplete="email" inputmode="email">
    <label>Parol</label><input id="aP" type="password" autocomplete="${upMode ? "new-password" : "current-password"}">
    <div class="err" id="aErr"></div>
    <button class="btn" id="aGo" style="margin-top:8px">${upMode ? "Qeydiyyatdan keç" : "Daxil ol"}</button>
    ${NATIVE ? "" : `<button class="btn sec" id="aG" style="margin-top:10px">Google ilə davam et</button>`}
    <button class="btn sec" id="aSkip" style="margin-top:10px">Keç — demo baxış</button>
    <p style="text-align:center;margin:14px 0 0"><button class="lnk" id="aSw">${upMode ? "Hesabım var — daxil ol" : "Hesabım yoxdur — qeydiyyat"}</button></p>
    ${upMode ? "" : `<p style="text-align:center;margin:8px 0 0"><button class="lnk" id="aRst">Parolu unutdum</button></p>`}
  </div>
  <p class="mut" style="text-align:center"><a class="lnk" href="privacy-policy.html">Gizlilik siyasəti</a></p>`;
  $("aSw").onclick = () => { upMode = !upMode; authView(); };
  $("aSkip").onclick = () => startDemo();
  const er = (m) => $("aErr").textContent = m;
  if ($("aRst")) $("aRst").onclick = async () => { const e = $("aE").value.trim(); if (!e) return er("E-poçtu yazın"); try { await sendPasswordResetEmail(auth, e); er(""); toast("Parolu bərpa linki göndərildi"); } catch (x) { er(fbErr(x)); } };
  if ($("aG")) $("aG").onclick = async () => { try { const gp = new GoogleAuthProvider(); gp.setCustomParameters({ prompt: "select_account" }); await signInWithPopup(auth, gp); } catch (x) { er(fbErr(x)); } };
  $("aGo").onclick = async () => {
    const e = $("aE").value.trim(), p = $("aP").value; er("");
    if (!e || !p) return er("E-poçt və parolu yazın");
    $("aGo").disabled = true;
    try { if (upMode) await createUserWithEmailAndPassword(auth, e, p); else await signInWithEmailAndPassword(auth, e, p); }
    catch (x) { er(fbErr(x)); $("aGo").disabled = false; }
  };
}

/* ---------------- Profil (ilk qeydiyyat) ---------------- */
function profView(edit) {
  show("prof"); const p = S.prof || {};
  $("v-prof").innerHTML = `<h2>${edit ? "Profili yenilə" : "Sürücü məlumatları"}</h2>
  <p class="mut">${edit ? "" : "Məlumatlarınız yoxlanıldıqdan sonra sifariş qəbul edə biləcəksiniz."}</p>
  <div class="card">
    <label>Ad, soyad</label><input id="pN" value="${esc(p.name || (S.me && S.me.displayName) || "")}" autocomplete="name">
    <label>Telefon (sərnişin zəng edəcək)</label><input id="pT" type="tel" inputmode="tel" placeholder="+994 50 000 00 00" value="${esc(p.phone || "")}">
    <label>Avtomobil (marka, model)</label><input id="pC" placeholder="Toyota Camry" value="${esc(p.car || "")}">
    <div class="row"><div><label>Rəng</label><input id="pR" placeholder="Ağ" value="${esc(p.color || "")}"></div>
    <div><label>Nömrə nişanı</label><input id="pP" placeholder="10-AB-123" value="${esc(p.plate || "")}"></div></div>
    <label>Xidmət sinfi</label><select id="pK">${CLASSES.map((c) => `<option value="${c[0]}" ${p.cls === c[0] ? "selected" : ""}>${c[1]}</option>`).join("")}</select>
    <div class="err" id="pErr"></div>
    <button class="btn" id="pGo" style="margin-top:8px">${edit ? "Yadda saxla" : "Təsdiq üçün göndər"}</button>
    ${edit ? `<button class="btn sec" id="pBack" style="margin-top:10px">Geri</button>` : ""}
  </div>`;
  if ($("pBack")) $("pBack").onclick = () => { S.tab = "me"; route(); };
  $("pGo").onclick = async () => {
    const v = { name: $("pN").value.trim(), phone: $("pT").value.trim(), car: $("pC").value.trim(), color: $("pR").value.trim(), plate: $("pP").value.trim().toUpperCase(), cls: $("pK").value };
    const er = (m) => $("pErr").textContent = m;
    if (v.name.length < 3) return er("Adınızı yazın");
    if (v.phone.replace(/\D/g, "").length < 9) return er("Telefon nömrəsi düzgün deyil");
    if (!v.car || !v.color || v.plate.length < 4) return er("Avtomobil, rəng və nömrə nişanını yazın");

  const icon = { path: google.maps.SymbolPath.CIRCLE, scale: 9, fillColor: "#FF5FA2", fillOpacity: 1, strokeColor: "#ffffff", strokeWeight: 3 };
  if (!navMk.pax) navMk.pax = new google.maps.Marker({ position: pp, map: g, icon, zIndex: 8, title: "Sərnişin" }); else navMk.pax.setPosition(pp);
}
function moveCar() {
  const g = S.gm; if (!g || !S.pos) return;
  const icon = { path: google.maps.SymbolPath.FORWARD_CLOSED_ARROW, scale: 6, rotation: S.pos.heading || 0, fillColor: "#10C98F", fillOpacity: 1, strokeColor: "#04100F", strokeWeight: 2 };
  if (!navMk.car) navMk.car = new google.maps.Marker({ position: S.pos, map: g, icon, zIndex: 9 }); else { navMk.car.setPosition(S.pos); navMk.car.setIcon(icon); }
  if (S.nav && S.nav.follow) g.panTo(S.pos);
}
function distToPath(path, p) { let m = Infinity; for (let k = 0; k < path.length; k += 1) { const d = hav(p, path[k]) * 1000; if (d < m) m = d; } return m; }
function navTick() {
  const N = S.nav, r = S.active; if (!N || !r || !S.pos) return;
  moveCar(); movePax();
  if (r.status === "arrived") return;
  if (!N.route) { if (!N.busy && Date.now() - N.lastRoute > 6000) planRoute(); return; }
  const st = N.route.steps;
  while (N.i < st.length - 1 && hav(S.pos, st[N.i].end) * 1000 < 25) N.i++;
  if (!N.busy && Date.now() - N.lastRoute > 15000 && distToPath(N.route.path, S.pos) > 150) { toast("Marşrut yenilənir…", 1500); N.route = null; planRoute(); return; }
  paintTop();
}
function remaining(N) {
  const st = N.route.steps, cur = S.pos && st[N.i] ? hav(S.pos, st[N.i].end) * 1000 : 0;
  let m = cur; for (let k = N.i + 1; k < st.length; k++) m += st[k].m;
  const ratio = N.route.meters ? N.route.sec / N.route.meters : 0.12; return { m, sec: m * ratio };
}
function paintTop() {
  const el = $("navTop"), N = S.nav, r = S.active; if (!el || !N || !r) return;
  const tgt = targetOf(r);
  if (r.status === "arrived") { el.innerHTML = `<div class="m"><div class="ic">📍</div><div><div class="t">Sərnişini gözləyirsiniz</div><div class="mut">${esc((r.pickup.addr || "").split(",")[0])}</div></div></div>`; return; }
  if (N.err && !N.route) { el.innerHTML = `<div class="m"><div class="ic">⚠️</div><div><div class="t">Marşrut alınmadı</div><div class="mut">${esc(N.err).slice(0, 90)}</div></div></div><div class="s">Google Maps / Waze düyməsindən istifadə edin</div>`; return; }
  if (!N.route) { el.innerHTML = `<div class="m"><div class="ic">⏳</div><div><div class="t">${S.pos ? "Marşrut hazırlanır…" : "Yeriniz müəyyən edilir…"}</div></div></div>`; return; }
  const st = N.route.steps[N.i], rem = remaining(N), dNext = st && S.pos ? hav(S.pos, st.end) * 1000 : 0;
  const last = N.i >= N.route.steps.length - 1;
  el.innerHTML = `<div class="m"><div class="ic">${last ? "🏁" : manIcon(st && st.man)}</div><div style="flex:1"><div class="d">${fmtKm(dNext)}</div><div class="t">${esc((st && st.text) || (last ? "Təyinat nöqtəsinə çatırsınız" : "Düz davam edin"))}</div></div></div>
  <div class="s">${r.status === "ongoing" ? "Təyinata" : "Sərnişinə"}: ${fmtKm(rem.m)} · ${fmtMin(rem.sec)}${r.status === "accepted" && rem.m < 80 ? " · <b style='color:var(--em)'>Çatdınız? “Çatdım” basın</b>" : ""}</div>`;
}
function paintSheet(r) {
  const el = $("navSheet"); if (!el) return; const st = r.status, wf = waitFee(r), tot = money((+r.price || 0) + wf), cm = commOf((+r.price || 0) + wf), net = money((+r.price || 0) + wf - cm);
  const title = { accepted: "Sərnişinə doğru gedin", arrived: "Sərnişini gözləyirsiniz", ongoing: "Səfər davam edir" }[st], tgt = targetOf(r);
  el.innerHTML = `<div class="row" style="justify-content:space-between;margin-bottom:6px"><div><b style="font-size:18px">${title}</b><div class="mut">${esc(r.name || "Sərnişin")} · ${esc(r.km)} km · ${r.pay === "cash" ? "💵 Nağd" : "💳 Kart"}</div></div><div style="text-align:right;flex:none"><div style="font-size:24px;font-weight:800;color:var(--em)">${tot} ₼</div><div class="mut">${cm > 0 ? "Xalis " + net + " ₼" : "Komissiya 0%"}${wf ? " · gözləmə +" + money(wf) : ""}</div></div></div>
  ${(() => { const pp = paxPos(r); return pp && S.pos ? `<div class="chip" style="background:rgba(255,95,162,.15);color:var(--pink);margin-bottom:6px">👤 Sərnişin sizdən ${fmtKm(hav(S.pos, pp) * 1000)} məsafədədir</div>` : ""; })()}
  <div class="mut" style="margin:4px 0 10px">${st === "ongoing" ? "🏁" : "📍"} ${esc(tgt.addr || "")}${(r.stops || []).length && st === "ongoing" ? ` · +${r.stops.length} dayanacaq` : ""}${r.note ? `<br>“${esc(r.note)}”` : ""}</div>
  <div class="row"><a class="btn sec" href="tel:${esc(r.phone || "")}" style="padding:11px">📞 Zəng</a><a class="btn sec" href="sms:${esc(r.phone || "")}" style="padding:11px">💬 SMS</a><a class="btn sec" target="_blank" rel="noopener" href="${navUrl(tgt)}" style="padding:11px">🧭 Google</a><a class="btn sec" target="_blank" rel="noopener" href="${wazeUrl(tgt)}" style="padding:11px">Waze</a></div>
  ${st === "accepted" ? `<button class="btn" id="aArr" style="margin-top:10px;background:var(--sea);padding:18px">📍 Çatdım</button>` : ""}
  ${st === "arrived" ? `<button class="btn" id="aStart" style="margin-top:10px;padding:18px">▶ Səfəri başlat</button><p class="mut" id="wTxt" style="text-align:center;margin:8px 0 0"></p>` : ""}
  ${st === "ongoing" ? `<button class="btn" id="aDone" style="margin-top:10px;padding:18px">✅ Səfəri bitir · ${tot} ₼</button>` : ""}
  ${st !== "ongoing" ? `<p style="text-align:center;margin:10px 0 0"><button class="lnk" id="aCan" style="color:#ff7b8c">Sifarişi ləğv et</button></p>` : ""}`;
  if ($("aArr")) $("aArr").onclick = () => setStatus(r, "arrived");
  if ($("aStart")) $("aStart").onclick = () => setStatus(r, "ongoing");
  if ($("aDone")) $("aDone").onclick = () => { if (confirm("Səfəri bitirmək istəyirsiniz? Sərnişindən " + tot + " ₼ alın.")) setStatus(r, "completed"); };
  if ($("aCan")) $("aCan").onclick = () => cancelActive(r);
  clearInterval(waitTick);
  if (st === "arrived") waitTick = setInterval(() => { const x = $("wTxt"); if (!x || !S.active) return clearInterval(waitTick); const t = Math.floor((Date.now() - r.arrivedAtMs) / 1000), fr = ((r.tariff && r.tariff.waitFree) != null ? r.tariff.waitFree : S.settings.waitFree) * 60, left = fr - t; x.textContent = left > 0 ? `Pulsuz gözləmə: ${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}` : `Pulsuz gözləmə bitdi · +${money(waitFee(r))} ₼`; }, 1000);
  const h = el.offsetHeight; if (h) $("v-nav").style.setProperty("--sheet-h", h + "px");
}

/* ---------------- Bolt tipli gələn sifariş pəncərəsi ---------------- */
let ovTimer = null, ovBeep = null;
function hideOverlay() { $("ovr").classList.add("hidden"); $("ovr").innerHTML = ""; clearInterval(ovTimer); clearInterval(ovBeep); S.ovId = null; }
function renderOverlay() {
  const r = S.prof && S.prof.approved && S.online && !S.active && S.me ? S.rides[0] : null;
  if (!r) return hideOverlay();
  if (S.ovId === r.id) return;
  hideOverlay(); S.ovId = r.id; const t0 = Date.now(), el = $("ovr"), cm = commOf(r.price), net = money((+r.price || 0) - cm);
  const pick = r._d != null ? `${r._d.toFixed(1)} km · ≈ ${Math.max(1, Math.round(r._d / 0.45))} dəq` : "—";
  el.innerHTML = `<div class="hd"><span class="chip">${esc((CLASSES.find((c) => c[0] === r.cls) || [, r.cls])[1])}</span><div class="ring"><svg width="64" height="64"><circle cx="32" cy="32" r="28" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="6"/><circle id="ovArc" cx="32" cy="32" r="28" fill="none" stroke="#10C98F" stroke-width="6" stroke-linecap="round" stroke-dasharray="176" stroke-dashoffset="0"/></svg><b id="ovSec">${OV_SEC}</b></div></div>
    <div class="pr">${net} ₼</div><div class="sub">${cm > 0 ? `Sifariş ${money(r.price)} ₼ · komissiya ${S.settings.commissionPct}% (−${money(cm)} ₼)` : `Komissiya 0% · sizin qazancınız`}</div>
    <div class="ovc"><div class="l"><span class="dot a"></span><div><b>${esc((r.pickup.addr || "").split(",").slice(0, 2).join(","))}</b><small>Götürülmə · ${pick}</small></div></div>
      <div class="l"><span class="dot b"></span><div><b>${esc(((r.dropoff && r.dropoff.addr) || "").split(",").slice(0, 2).join(","))}</b><small>Təyinat · ${esc(r.km)} km${r.min ? " · ≈ " + fmtMin(r.min * 60) : ""}</small></div></div></div>
    <div class="ovc" style="margin-top:10px"><small>${r.pay === "cash" ? "💵 Nağd ödəniş" : "💳 Kartla ödəniş"}${r.prefsText ? " · " + esc(r.prefsText) : ""}${(r.stops || []).length ? " · " + r.stops.length + " dayanacaq" : ""}${r.note ? " · “" + esc(r.note) + "”" : ""}</small></div>
    <div class="acts"><button class="x" id="ovNo" aria-label="Rədd et">✕</button><button class="ok" id="ovOk">Qəbul et</button></div>`;
  el.classList.remove("hidden"); beep();
  ovBeep = setInterval(beep, 2500);
  $("ovOk").onclick = () => { const id = r.id; hideOverlay(); accept(id); };
  $("ovNo").onclick = () => { S.hidden.add(r.id); hideOverlay(); filterRides(); };
  ovTimer = setInterval(() => {
    const left = OV_SEC - (Date.now() - t0) / 1000;
    if (left <= 0) { S.hidden.add(r.id); hideOverlay(); toast("Sifariş vaxtı bitdi"); filterRides(); return; }
    const a = $("ovArc"), sc = $("ovSec"); if (a) a.style.strokeDashoffset = String(176 * (1 - left / OV_SEC)); if (sc) sc.textContent = Math.ceil(left);
  }, 200);
}

/* ---------------- Qazanc ---------------- */
function renderEarn() {
  show("earn"); const now = new Date(), d0 = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime(), w0 = d0 - ((now.getDay() + 6) % 7) * 86400000;
  const sum = (from) => S.history.filter((r) => (r.completedAtMs || 0) >= from).reduce((a, r) => a + (r.driverEarning != null ? +r.driverEarning : (+r.finalPrice || +r.price || 0)), 0), cnt = (from) => S.history.filter((r) => (r.completedAtMs || 0) >= from).length;
  $("v-earn").innerHTML = `<h2>Qazanc</h2><div class="stat"><div><span class="mut">Bu gün</span><b>${money(sum(d0))} ₼</b><span class="mut">${cnt(d0)} səfər</span></div><div><span class="mut">Bu həftə</span><b>${money(sum(w0))} ₼</b><span class="mut">${cnt(w0)} səfər</span></div></div>
  <p class="mut">Göstərilən məbləğ komissiyadan sonra sizin xalis qazancınızdır. Hazırkı komissiya: <b>${S.settings.commissionPct || 0}%</b>.</p><h3 style="margin-top:14px">Son səfərlər</h3>`
    + (S.history.length ? S.history.slice(0, 30).map((r) => `<div class="ride"><div class="row" style="justify-content:space-between"><b>${money(r.driverEarning != null ? r.driverEarning : (r.finalPrice || r.price))} ₼</b><span class="mut">${r.completedAtMs ? new Date(r.completedAtMs).toLocaleString("az-AZ", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) : ""}</span></div><div class="mut">${esc((r.pickup.addr || "").split(",")[0])} → ${esc(((r.dropoff && r.dropoff.addr) || "").split(",")[0])}${r.rating ? " · ⭐ " + r.rating : ""}</div></div>`).join("") : `<div class="card mut" style="text-align:center">Hələ tamamlanmış səfər yoxdur</div>`);
}

/* ---------------- Profil ---------------- */
function renderMe() {
  show("me"); const p = S.prof;
  $("v-me").innerHTML = `<h2>Profil</h2><div class="card"><h3>${esc(p.name)}</h3><div class="mut">${esc(p.phone)}<br>${esc(p.color)} ${esc(p.car)} · ${esc(p.plate)}<br>Sinif: ${esc((CLASSES.find((c) => c[0] === p.cls) || [, p.cls])[1])} · ⭐ ${(+p.rating || 5).toFixed(1)}</div></div>
  <button class="btn sec" id="mEd">Məlumatları dəyiş</button>
  <a class="btn sec" style="margin-top:10px" href="privacy-policy.html">Gizlilik siyasəti</a>
  <a class="btn sec" style="margin-top:10px" href="delete-account.html">Hesabın silinməsi</a>
  <a class="btn sec" style="margin-top:10px" href="https://wa.me/994702484852">Dəstək (WhatsApp)</a>
  <button class="btn red" id="mOut" style="margin-top:10px">Çıxış</button>
  <button class="btn sec" id="mDel" style="margin-top:10px;color:#ff7b8c">Hesabı və məlumatlarımı sil</button>`;
  $("mEd").onclick = () => profView(true);
  if (S.demo) $("mDel").classList.add("hidden");
  $("mOut").onclick = async () => { if (S.active) return toast("Aktiv sifariş var"); await setOnline(false); if (S.demo) { S.demo = false; S.me = null; S.prof = null; return route(); } signOut(auth); };
  $("mDel").onclick = async () => {
    if (S.active) return toast("Aktiv sifariş var");
    if (!confirm("Hesabınız və bütün sürücü məlumatlarınız həmişəlik silinəcək. Davam edilsin?")) return;
    const u = auth.currentUser, uid = u.uid;
    const last = u.metadata && u.metadata.lastSignInTime ? Date.parse(u.metadata.lastSignInTime) : 0;
    if (Date.now() - last > 5 * 60 * 1000) { toast("Təhlükəsizlik üçün çıxış edib yenidən daxil olun, sonra hesabı silin", 5500); return; }
    try {
      await setOnline(false);
      await deleteDoc(doc(db, "taxiDrivers", uid)).catch(() => {});
      await deleteDoc(doc(db, "taxiDriverProfiles", uid));
      await deleteUser(u);
      toast("Hesabınız silindi");
    } catch (e) { toast(fbErr(e), 4000); setTimeout(() => location.reload(), 1500); }
  };
}

/* ---------------- Demo baxış (giriş olmadan, heç nə Firebase-ə yazılmır) ---------------- */
function demoRides() {
  const b = { lat: 40.4093, lng: 49.8671 }, now = Date.now();
  return [
    { id: "d1", uid: "x", name: "Nigar", phone: "+994500000001", cls: "eko", pay: "cash", price: 4.4, km: 5.2, status: "searching", createdAtMs: now, custLat: 40.4098, custLng: 49.8676, custAtMs: now + 3600000, pickup: { ...b, addr: "28 Mall, Bakı" }, dropoff: { lat: 40.37, lng: 49.85, addr: "Nərimanov metrosu, Bakı" }, tariff: { waitFree: 3, waitPerMin: 0.2 } },
    { id: "d2", uid: "x", name: "Rauf", phone: "+994500000002", cls: "eko", pay: "card", price: 7.9, km: 9.1, status: "searching", createdAtMs: now, pickup: { lat: 40.4145, lng: 49.8712, addr: "Fəvvarələr meydanı, Bakı" }, dropoff: { lat: 40.4677, lng: 50.0467, addr: "Heydər Əliyev hava limanı" }, prefsText: "Sakit səfər", tariff: { waitFree: 3, waitPerMin: 0.2 } }
  ].map((r) => ({ ...r, _d: r.id === "d1" ? 0.4 : 1.1 }));

function startDemo() {
  S.demo = true; S.me = { uid: "demo", email: "demo@goroute.az" };
  S.prof = { name: "Demo Sürücü", phone: "+994500000000", car: "Toyota Camry", color: "Ağ", plate: "10-DE-001", cls: "eko", approved: true, rating: 4.9 };
  S.online = false; S.active = null; S.rides = []; S.history = []; S.tab = "home";
  toast("Demo rejimi: heç nə yadda saxlanmır", 3500); route();
}

/* ---------------- Marşrut ---------------- */
function route() {
  if (!S.me) { hideOverlay(); hideNav(); return authView(); }
  if (!S.prof) return profView(false);
  if (!S.prof.approved) return waitView();
  if (S.active) { hideOverlay(); return renderNav(); }
  hideNav(); renderOverlay();
  if (S.tab === "earn") return renderEarn();
  if (S.tab === "me") return renderMe();
  renderHome();
}
async function loadSettings() { try { const d = await getDoc(doc(db, "settings", "taxi")); if (d.exists()) { const v = d.data(); if (v.waitFree != null) S.settings.waitFree = +v.waitFree; if (v.waitPerMin != null) S.settings.waitPerMin = +v.waitPerMin; if (v.commissionPct != null) S.settings.commissionPct = Math.min(100, Math.max(0, +v.commissionPct || 0)); } } catch (e) {} }

onAuthStateChanged(auth, (u) => {
  if (S.demo && !u) return;
  S.demo = false; S.me = u;
  if (unsubProf) { unsubProf(); unsubProf = null; } if (unsubActive) { unsubActive(); unsubActive = null; } if (unsubRides) { unsubRides(); unsubRides = null; }
  if (!u) { S.prof = null; S.active = null; stopGeo(); return authView(); }
  show("load"); loadSettings();
  unsubProf = onSnapshot(doc(db, "taxiDriverProfiles", u.uid), (d) => {
    const wasApproved = S.prof && S.prof.approved; S.prof = d.exists() ? d.data() : null;
    if (S.prof && S.prof.approved && !wasApproved) { watchActive(); if (S.online) { startGeo(); watchRides(); pushState(); } }
    route();
  }, (e) => { toast(fbErr(e), 4000); route(); });
});

if ("serviceWorker" in navigator && !NATIVE) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
